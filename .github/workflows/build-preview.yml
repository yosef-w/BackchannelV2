# On-demand internal/TestFlight build for manual QA — nothing else in this
# pipeline actually produces a "preview"-profile build (checked: zero ever
# built), so the preview channel/OTA path had no real device to reach.
# Run this from the Actions tab (Run workflow) whenever you want a fresh
# build to hand testers, instead of running `eas build --profile preview`
# from a terminal.
#
# Requires the same EXPO_TOKEN secret as the other workflows.
name: Build Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "develop"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview
        # Internal distribution (see eas.json's preview profile) — installs
        # via a shared link, not a store review. This build's runtime
        # fingerprint is what determines whether it can later receive OTA
        # updates published to the preview channel (see app.json's
        # runtimeVersion policy) — no App Store/TestFlight review involved.
        run: |
          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --wait
