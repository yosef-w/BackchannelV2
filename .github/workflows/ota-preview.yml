# Publishes an over-the-air JS/asset update to the "preview" channel on
# every push to develop — the mobile equivalent of an auto-deploy-on-merge
# to a staging environment. Only reaches devices already running a build
# whose native fingerprint matches this commit's (see app.json's
# runtimeVersion policy) — a build that changed native code simply won't
# receive it, by design, rather than crashing on an incompatible update.
#
# Requires an EXPO_TOKEN repo secret (Settings → Secrets and variables →
# Actions). Generate it at https://expo.dev/settings/access-tokens —
# prefer a robot-user token scoped to this project over a personal one, so
# CI access doesn't depend on any one person's account. Also requires a
# SENTRY_AUTH_TOKEN repo secret so the update's source maps upload — see
# docs/CI_CD_PIPELINE.md for both.
name: OTA Update (preview)

on:
  push:
    branches: [develop]
    # Skip publishing a no-op update for changes that can't affect what
    # ships to a device — same spirit as ci.yml only gating real changes.
    paths-ignore:
      - "**.md"
      - "docs/**"

# If two pushes land close together, only the newest one should actually
# publish — without this, a slower-finishing older run could publish
# AFTER a newer one and briefly put testers back on older code. This
# cancels an in-flight run for this branch the moment a newer push starts
# one; it does not affect ci.yml's own run, which still checks every push.
concurrency:
  group: ota-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to preview
        # Deliberately NOT `--message "${{ github.event.head_commit.message }}"`
        # — a commit message containing a literal quote character (this repo
        # has already hit this) closes the shell argument early and the rest
        # of the message gets fed to `eas update` as stray extra arguments,
        # failing the whole publish. `"$(git log -1 --pretty=%s)"` captures
        # just the subject line via a real shell variable, which bash treats
        # as an opaque string — embedded quotes can't break out of it.
        run: |
          eas update \
            --branch preview \
            --message "$(git log -1 --pretty=%s)" \
            --non-interactive

      - name: Upload source maps to Sentry
        # `eas update` leaves the exact bundle it just published in dist/ —
        # uploading FROM that directory (rather than a separate `expo
        # export` run) guarantees the source maps match the real published
        # bundle byte-for-byte. Without this, a crash from a phone running
        # this OTA update shows up in Sentry as minified/unreadable, even
        # though native builds already get this for free via EAS Build.
        # Org/project are read from app.json's Sentry plugin config —
        # only the auth token needs to be supplied here.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx sentry-expo-upload-sourcemaps dist
